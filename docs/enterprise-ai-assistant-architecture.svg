<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Knowledge Assistant Architecture</title>
  <desc id="desc">Architecture showing Streamlit, FastAPI security controls, LangGraph agents, hybrid retrieval, Pinecone, OpenAI, memory, LangSmith, and structured logging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #c7d2fe; }
      .lane { font: 700 15px Arial, sans-serif; fill: #475569; letter-spacing: 1.2px; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #475569; }
      .small-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .small-text { font: 400 13px Arial, sans-serif; fill: #475569; }
      .arrow-label { font: 600 12px Arial, sans-serif; fill: #475569; }
      .white-title { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .white-text { font: 400 13px Arial, sans-serif; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1600" height="1120" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="112" rx="24" fill="url(#header)"/>
  <rect y="88" width="1600" height="24" fill="url(#header)"/>
  <text x="70" y="52" class="title">Enterprise AI Knowledge Assistant</text>
  <text x="70" y="82" class="subtitle">One-day POC: secure multi-agent RAG with visible reasoning flow and evidence-grounded answers</text>

  <text x="54" y="154" class="lane">EXPERIENCE</text>
  <rect x="54" y="172" width="1492" height="134" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <rect x="90" y="202" width="224" height="76" rx="14" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="202" y="232" text-anchor="middle" class="box-title">Employee</text>
  <text x="202" y="256" text-anchor="middle" class="box-text">Viewer / Analyst / Admin</text>

  <rect x="434" y="190" width="550" height="100" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="709" y="222" text-anchor="middle" class="box-title">Streamlit Chat Interface</text>
  <text x="709" y="248" text-anchor="middle" class="box-text">Multi-turn chat • streaming responses • login</text>
  <text x="709" y="270" text-anchor="middle" class="box-text">Real-time agent activity panel</text>

  <rect x="1100" y="202" width="400" height="76" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1300" y="232" text-anchor="middle" class="box-title">Visible Execution Events</text>
  <text x="1300" y="256" text-anchor="middle" class="box-text">nodes • tools • retrieval • validation • memory</text>

  <line x1="314" y1="240" x2="424" y2="240" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="984" y1="240" x2="1090" y2="240" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="54" y="350" class="lane">API, SECURITY AND CONTROL</text>
  <rect x="54" y="368" width="1492" height="152" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>

  <rect x="96" y="397" width="300" height="94" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="246" y="429" text-anchor="middle" class="box-title">FastAPI Async API</text>
  <text x="246" y="455" text-anchor="middle" class="box-text">HTTP / SSE • Pydantic validation</text>
  <text x="246" y="476" text-anchor="middle" class="box-text">timeouts • typed exceptions</text>

  <rect x="450" y="397" width="240" height="94" rx="15" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="429" text-anchor="middle" class="small-title">Authentication + RBAC</text>
  <text x="570" y="455" text-anchor="middle" class="small-text">identity • roles • access filters</text>
  <text x="570" y="476" text-anchor="middle" class="small-text">tool authorization</text>

  <rect x="730" y="397" width="240" height="94" rx="15" fill="#fee2e2" stroke="#ef4444"/>
  <text x="850" y="429" text-anchor="middle" class="small-title">Security Guardrails</text>
  <text x="850" y="455" text-anchor="middle" class="small-text">injection • exfiltration • abuse</text>
  <text x="850" y="476" text-anchor="middle" class="small-text">citation + output validation</text>

  <rect x="1010" y="397" width="220" height="94" rx="15" fill="#ecfccb" stroke="#84cc16"/>
  <text x="1120" y="429" text-anchor="middle" class="small-title">Token Bucket</text>
  <text x="1120" y="455" text-anchor="middle" class="small-text">per-user configurable limits</text>
  <text x="1120" y="476" text-anchor="middle" class="small-text">graceful HTTP 429</text>

  <rect x="1270" y="397" width="230" height="94" rx="15" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1385" y="429" text-anchor="middle" class="small-title">Safe Failure Boundary</text>
  <text x="1385" y="455" text-anchor="middle" class="small-text">retry • fallback • degradation</text>
  <text x="1385" y="476" text-anchor="middle" class="small-text">no unsupported answers</text>

  <line x1="709" y1="290" x2="709" y2="355" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="726" y="335" class="arrow-label">HTTP / SSE</text>

  <text x="54" y="564" class="lane">LANGGRAPH MULTI-AGENT ORCHESTRATION</text>
  <rect x="54" y="582" width="1492" height="262" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <rect x="86" y="612" width="1080" height="202" rx="17" fill="#f8fafc" stroke="#818cf8" stroke-width="2"/>
  <text x="110" y="642" class="small-title">Stateful LangGraph workflow</text>

  <rect x="122" y="670" width="220" height="94" rx="15" fill="#312e81"/>
  <text x="232" y="704" text-anchor="middle" class="white-title">Supervisor Agent</text>
  <text x="232" y="730" text-anchor="middle" class="white-text">intent • plan • route</text>
  <text x="232" y="750" text-anchor="middle" class="white-text">authorize next action</text>

  <rect x="414" y="670" width="220" height="94" rx="15" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="524" y="704" text-anchor="middle" class="small-title">Retrieval Agent</text>
  <text x="524" y="730" text-anchor="middle" class="small-text">hybrid search • filters</text>
  <text x="524" y="750" text-anchor="middle" class="small-text">evidence + attribution</text>

  <rect x="706" y="670" width="220" height="94" rx="15" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="816" y="704" text-anchor="middle" class="small-title">Analysis / RLM Agent</text>
  <text x="816" y="730" text-anchor="middle" class="small-text">decompose • batch • analyze</text>
  <text x="816" y="750" text-anchor="middle" class="small-text">aggregate findings</text>

  <rect x="998" y="670" width="136" height="94" rx="15" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1066" y="704" text-anchor="middle" class="small-title">Response</text>
  <text x="1066" y="730" text-anchor="middle" class="small-text">ground answer</text>
  <text x="1066" y="750" text-anchor="middle" class="small-text">verify citations</text>

  <line x1="342" y1="717" x2="404" y2="717" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="634" y1="717" x2="696" y2="717" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="926" y1="717" x2="988" y2="717" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1210" y="612" width="300" height="82" rx="15" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="1360" y="644" text-anchor="middle" class="box-title">Session Memory</text>
  <text x="1360" y="670" text-anchor="middle" class="box-text">conversation + user context</text>
  <path d="M 1166 675 C 1190 675, 1190 653, 1200 653" fill="none" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1200 681 C 1180 705, 1180 735, 1166 735" fill="none" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1210" y="724" width="300" height="72" rx="15" fill="#fff7ed" stroke="#f97316"/>
  <text x="1360" y="753" text-anchor="middle" class="box-title">Activity Event Stream</text>
  <text x="1360" y="778" text-anchor="middle" class="box-text">safe progress events to the UI</text>

  <line x1="396" y1="444" x2="396" y2="565" stroke="#2563eb" stroke-width="3"/>
  <line x1="396" y1="565" x2="232" y2="565" stroke="#2563eb" stroke-width="3"/>
  <line x1="232" y1="565" x2="232" y2="660" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <text x="54" y="888" class="lane">TOOLS, KNOWLEDGE AND OBSERVABILITY</text>
  <rect x="54" y="906" width="1492" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>

  <rect x="86" y="936" width="272" height="108" rx="15" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="222" y="969" text-anchor="middle" class="small-title">Hybrid Knowledge Search</text>
  <text x="222" y="995" text-anchor="middle" class="small-text">dense embeddings + BM25</text>
  <text x="222" y="1017" text-anchor="middle" class="small-text">score fusion + metadata filters</text>

  <rect x="394" y="936" width="210" height="108" rx="15" fill="#dbeafe" stroke="#2563eb"/>
  <text x="499" y="969" text-anchor="middle" class="small-title">Pinecone</text>
  <text x="499" y="995" text-anchor="middle" class="small-text">namespaces • vectors</text>
  <text x="499" y="1017" text-anchor="middle" class="small-text">document metadata</text>

  <rect x="640" y="936" width="210" height="108" rx="15" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="745" y="969" text-anchor="middle" class="small-title">Python Analysis</text>
  <text x="745" y="995" text-anchor="middle" class="small-text">structured aggregation</text>
  <text x="745" y="1017" text-anchor="middle" class="small-text">bounded + authorized</text>

  <rect x="886" y="936" width="178" height="108" rx="15" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="7 5"/>
  <text x="975" y="969" text-anchor="middle" class="small-title">MCP Server</text>
  <text x="975" y="995" text-anchor="middle" class="small-text">dummy enterprise data</text>
  <text x="975" y="1017" text-anchor="middle" class="small-text">optional / lower priority</text>

  <rect x="1100" y="936" width="190" height="108" rx="15" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1195" y="969" text-anchor="middle" class="small-title">OpenAI</text>
  <text x="1195" y="995" text-anchor="middle" class="small-text">reasoning + generation</text>
  <text x="1195" y="1017" text-anchor="middle" class="small-text">grounded by evidence</text>

  <rect x="1326" y="936" width="184" height="108" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="1418" y="969" text-anchor="middle" class="small-title">LangSmith + Logs</text>
  <text x="1418" y="995" text-anchor="middle" class="small-text">agents • tools • retrieval</text>
  <text x="1418" y="1017" text-anchor="middle" class="small-text">latency • failures</text>

  <line x1="524" y1="764" x2="524" y2="876" stroke="#475569" stroke-width="3"/>
  <line x1="524" y1="876" x2="222" y2="876" stroke="#475569" stroke-width="3"/>
  <line x1="222" y1="876" x2="222" y2="926" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="358" y1="990" x2="384" y2="990" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="816" y1="764" x2="816" y2="926" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 850 787 C 960 820, 975 850, 975 926" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M 1066 764 C 1100 838, 1195 840, 1195 926" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1134 692 C 1280 690, 1418 770, 1418 926" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <text x="1488" y="1098" text-anchor="end" class="small-text">Solid lines: request/data flow  •  Dashed lines: optional or telemetry flow</text>
</svg>
